<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Drift</title>
<meta name="description" content="An interactive particle field that swirls toward your cursor."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"/>
<style>
:root {
  --color-bg: #0c0c0d;
  --color-surface: #161618;
  --color-fg: #f4f2ec;
  --color-muted: #a7a59e;
  --color-subtle: #7c7b75;
  --color-border: #2e2e32;
  --color-accent: #f4f2ec;
  --color-accent-fg: #141311;
  --font-display: "Instrument Serif", "Iowan Old Style", Palatino, Georgia, serif;
  --font-sans: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif;
}
:root {
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --motion-quick: 150ms;
  --motion-fast: 250ms;
}


  html,
  body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }

  body {
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-sans);
    line-height: 1.5;
  }

  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }

.shell {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #070708;
  color: var(--color-fg);
  user-select: none;
}

.shell[data-bg="void"] {
  background: #070708;
}
.shell[data-bg="graphite"] {
  background: #14161c;
}
.shell[data-bg="depth"] {
  background: #0b1618;
}
.shell[data-bg="paper"] {
  background: #efece4;
}

.field-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
  background: #070708;
}

.shell[data-bg="void"] .field-canvas {
  background: #070708;
}
.shell[data-bg="graphite"] .field-canvas {
  background: #14161c;
}
.shell[data-bg="depth"] .field-canvas {
  background: #0b1618;
}
.shell[data-bg="paper"] .field-canvas {
  background: #efece4;
}

.panel {
  position: absolute;
  z-index: 2;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  width: min(22rem, calc(100vw - 32px));
  max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow: auto;
  overscroll-behavior: contain;
  padding: 16px;
  border-radius: 24px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-fg);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
  animation: panel-in var(--motion-fast) var(--ease-out);
}

.panel-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.eyebrow {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.wordmark {
  margin: 4px 0 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 2.75rem;
  line-height: 0.95;
  letter-spacing: -0.03em;
}

.lede {
  margin: 8px 0 0;
  max-width: 28ch;
  color: var(--color-muted);
  font-size: 0.9375rem;
  line-height: 1.45;
}

.panel-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 16px;
}

.control {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.control-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--color-muted);
}

.control-value {
  color: var(--color-fg);
  font-variant-numeric: tabular-nums;
}

.slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 44px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}

.slider:focus {
  outline: none;
}

.slider:focus-visible {
  outline: 2px solid var(--color-fg);
  outline-offset: 2px;
  border-radius: 8px;
}

.slider::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--color-border);
  border-radius: 999px;
}

.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -8px;
  border: 0;
  border-radius: 999px;
  background: var(--color-fg);
  box-shadow: 0 0 0 4px var(--color-surface);
}

.slider::-moz-range-track {
  height: 2px;
  background: var(--color-border);
  border: 0;
  border-radius: 999px;
}

.slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: 0;
  border-radius: 999px;
  background: var(--color-fg);
}

.group {
  margin: 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.group legend {
  padding: 0;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--color-muted);
}

.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice,
.swatch,
.btn,
.text-btn,
.reopen {
  font: inherit;
  transition:
    background-color var(--motion-quick) var(--ease-out),
    color var(--motion-quick) var(--ease-out),
    border-color var(--motion-quick) var(--ease-out),
    transform var(--motion-quick) var(--ease-out);
}

.choice:active,
.swatch:active,
.btn:active,
.reopen:active {
  transform: scale(0.98);
}

.choice {
  min-height: 44px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-fg);
  font-size: 0.875rem;
  font-weight: 500;
}

.choice[aria-pressed="true"] {
  background: var(--color-fg);
  color: var(--color-accent-fg);
  border-color: var(--color-fg);
}

.swatches {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 64px;
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-muted);
  font-size: 0.75rem;
  font-weight: 500;
}

.swatch[aria-pressed="true"] {
  color: var(--color-fg);
  border-color: var(--color-border);
  background: color-mix(in oklab, var(--color-fg) 8%, transparent);
}

.swatch-chip {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--color-fg) 22%, transparent);
}

.swatch-void {
  background: #070708;
}
.swatch-graphite {
  background: #14161c;
}
.swatch-depth {
  background: #0b1618;
}
.swatch-paper {
  background: #efece4;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
}

.btn svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.btn-primary {
  border: 1px solid var(--color-fg);
  background: var(--color-fg);
  color: var(--color-accent-fg);
}

.btn-primary:hover {
  background: color-mix(in oklab, var(--color-fg) 88%, black);
}

.btn-ghost {
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-fg);
}

.btn-ghost:hover {
  border-color: color-mix(in oklab, var(--color-fg) 28%, var(--color-border));
}

.hint {
  margin: 0;
  color: var(--color-subtle);
  font-size: 0.75rem;
  line-height: 1.45;
}

.text-btn {
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 500;
}

.text-btn:hover {
  color: var(--color-fg);
}

.reopen {
  position: absolute;
  z-index: 2;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-fg);
  font-size: 0.875rem;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
}

.reopen svg {
  width: 16px;
  height: 16px;
}

.status {
  position: absolute;
  z-index: 2;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(12, 12, 13, 0.72);
  color: var(--color-fg);
  font-size: 0.8125rem;
  font-weight: 500;
  pointer-events: none;
}

.status::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.55;
}

.status.is-hot::before {
  opacity: 1;
}

.shell[data-bg="paper"] .status {
  background: rgba(239, 236, 228, 0.82);
  color: #1c1b18;
}

.choice:focus-visible,
.swatch:focus-visible,
.btn:focus-visible,
.text-btn:focus-visible,
.reopen:focus-visible {
  outline: 2px solid var(--color-fg);
  outline-offset: 2px;
}

.fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
}

@keyframes panel-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 720px) {
  .wordmark {
    font-size: 2.15rem;
  }

  .lede {
    display: none;
  }

  .panel {
    top: auto;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    left: max(12px, env(safe-area-inset-left));
    width: auto;
    max-height: min(52dvh, 460px);
    padding: 12px;
    border-radius: 20px;
  }

  .panel-body {
    gap: 12px;
    margin-top: 12px;
  }

  .status {
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    bottom: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .panel {
    animation: none;
  }

  .choice,
  .swatch,
  .btn,
  .text-btn,
  .reopen {
    transition: none;
  }

  .choice:active,
  .swatch:active,
  .btn:active,
  .reopen:active {
    transform: none;
  }
}

</style>
</head>
<body>
<main class="shell" id="shell" data-bg="void">
<canvas id="field" class="field-canvas" aria-label="Interactive particle field. Move to swirl particles toward the pointer. Click or tap for a pulse."></canvas>
<div>
<aside class="panel" id="panel" aria-label="Field controls">
<div class="panel-top"><div><p class="eyebrow">Particle field</p><h1 class="wordmark">Drift</h1></div><button type="button" class="text-btn" id="hide">Hide</button></div>
<p class="lede">The field spirals toward your cursor and keeps the path in its trail.</p>
<div class="panel-body">
<label class="control"><span class="control-label"><span>Particles</span><span class="control-value" id="count-value">1200</span></span>
<input class="slider" id="count" type="range" min="150" max="3600" step="50" value="1200" aria-valuemin="150" aria-valuemax="3600" aria-valuenow="1200" aria-valuetext="1200 particles"/></label>
<label class="control"><span class="control-label"><span>Force</span><span class="control-value" id="force-value">1.00</span></span>
<input class="slider" id="force" type="range" min="0.2" max="2.5" step="0.05" value="1" aria-valuemin="0.2" aria-valuemax="2.5" aria-valuenow="1" aria-valuetext="Force 1.00"/></label>
<fieldset class="group"><legend>Color</legend><div class="choices" id="colors"><button type="button" class="choice" data-palette="ember" aria-pressed="true">Ember</button><button type="button" class="choice" data-palette="tide" aria-pressed="false">Tide</button><button type="button" class="choice" data-palette="ash" aria-pressed="false">Ash</button><button type="button" class="choice" data-palette="dusk" aria-pressed="false">Dusk</button></div></fieldset>
<fieldset class="group"><legend>Background</legend><div class="swatches" id="grounds"><button type="button" class="swatch" data-bg="void" aria-pressed="true"><span class="swatch-chip swatch-void"></span>Void</button><button type="button" class="swatch" data-bg="graphite" aria-pressed="false"><span class="swatch-chip swatch-graphite"></span>Graphite</button><button type="button" class="swatch" data-bg="depth" aria-pressed="false"><span class="swatch-chip swatch-depth"></span>Depth</button><button type="button" class="swatch" data-bg="paper" aria-pressed="false"><span class="swatch-chip swatch-paper"></span>Paper</button></div></fieldset>
<div class="actions">
<button type="button" class="btn btn-ghost" id="reset">Reset</button>
<button type="button" class="btn btn-primary" id="save">Save image</button>
</div>
<p class="hint">Click or tap the field for a pulse. Press R to reset.</p>
</div>
</aside>
<button type="button" class="reopen" id="reopen" hidden>Controls</button>
</div>
<p class="status" id="status" aria-live="polite">Drifting</p>
</main>

<script>
const S = DriftSim;
let settings = S.loadSettings() || { ...S.DEFAULT_SETTINGS };
const sim = new S.DriftFieldSim();
const canvas = document.getElementById("field");
const shell = document.getElementById("shell");
const panel = document.getElementById("panel");
const reopen = document.getElementById("reopen");
const statusEl = document.getElementById("status");
const countInput = document.getElementById("count");
const forceInput = document.getElementById("force");
const countValue = document.getElementById("count-value");
const forceValue = document.getElementById("force-value");
const saveBtn = document.getElementById("save");
const ctx = canvas.getContext("2d", { alpha: false });

sim.onEngage = (active) => {
  statusEl.textContent = active ? "Curling toward you" : "Drifting";
  statusEl.classList.toggle("is-hot", active);
};

function paintSettings() {
  shell.dataset.bg = settings.background;
  countInput.value = String(settings.count);
  forceInput.value = String(settings.force);
  countValue.textContent = String(settings.count);
  forceValue.textContent = settings.force.toFixed(2);
  countInput.setAttribute("aria-valuenow", String(settings.count));
  countInput.setAttribute("aria-valuetext", settings.count + " particles");
  forceInput.setAttribute("aria-valuenow", String(settings.force));
  forceInput.setAttribute("aria-valuetext", "Force " + settings.force.toFixed(2));
  document.querySelectorAll("[data-palette]").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.palette === settings.palette ? "true" : "false");
  });
  document.querySelectorAll(".swatch").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.bg === settings.background ? "true" : "false");
  });
}

function update(partial) {
  settings = S.sanitizeSettings({ ...settings, ...partial });
  S.saveSettings(settings);
  paintSettings();
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  const bw = Math.round(w * dpr);
  const bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
    sim.hardClear = true;
  }
  sim.setView(w, h, dpr);
}

function stamp(date) {
  const p = (n) => String(n).padStart(2, "0");
  return (
    date.getFullYear() +
    p(date.getMonth() + 1) +
    p(date.getDate()) +
    "-" +
    p(date.getHours()) +
    p(date.getMinutes()) +
    p(date.getSeconds())
  );
}

document.getElementById("hide").addEventListener("click", () => {
  panel.hidden = true;
  reopen.hidden = false;
});
reopen.addEventListener("click", () => {
  panel.hidden = false;
  reopen.hidden = true;
});
countInput.addEventListener("input", () => update({ count: Number(countInput.value) }));
forceInput.addEventListener("input", () => update({ force: Number(forceInput.value) }));
document.getElementById("colors").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-palette]");
  if (!btn) return;
  update({ palette: btn.dataset.palette });
});
document.getElementById("grounds").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-bg]");
  if (!btn) return;
  update({ background: btn.dataset.bg });
});
document.getElementById("reset").addEventListener("click", () => sim.reset());
saveBtn.addEventListener("click", () => {
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "drift-" + stamp(new Date()) + ".png";
    link.click();
    URL.revokeObjectURL(url);
    const label = saveBtn.lastChild;
    if (label) label.textContent = " Saved";
    setTimeout(() => {
      if (label) label.textContent = " Save image";
    }, 1600);
  }, "image/png");
});

window.addEventListener(
  "pointermove",
  (event) => {
    if (panel.contains(event.target) || reopen.contains(event.target)) {
      sim.setPointerActive(false);
      return;
    }
    const rect = canvas.getBoundingClientRect();
    sim.setPointer(event.clientX - rect.left, event.clientY - rect.top, true);
  },
  { passive: true },
);
window.addEventListener(
  "pointerdown",
  (event) => {
    if (panel.contains(event.target) || reopen.contains(event.target)) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
    event.preventDefault();
    sim.setPointer(x, y, true);
    sim.pulse(x, y);
  },
  { passive: false },
);
window.addEventListener("blur", () => sim.setPointerActive(false));
document.documentElement.addEventListener("pointerleave", () => sim.setPointerActive(false));
window.addEventListener("keydown", (event) => {
  if (event.key !== "r" && event.key !== "R") return;
  if (event.target instanceof HTMLInputElement) return;
  sim.reset();
});

new ResizeObserver(resize).observe(canvas);
resize();
paintSettings();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  sim.force = settings.force;
  sim.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (sim.palette !== settings.palette) sim.palette = settings.palette;
  if (sim.background !== settings.background) {
    sim.background = settings.background;
    sim.hardClear = true;
  }
  sim.setCount(settings.count);
  sim.step(dt);
  sim.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
